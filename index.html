
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <aside class="sidebar">
            <h2>FocusFlow</h2>

            <div class="menu">
                <button class="active" data-filter="all">All Tasks</button>
                <button data-filter="today">Today</button>
                <button data-filter="high">High Priority</button>
                <button data-filter="completed">Completed</button>
            </div>

            <div class="tip">
                <strong>Focus Tip</strong>
                <p>Complete the most important task first.</p>
            </div>

            <button id="themeBtn" class="theme-btn">Dark Mode</button>
        </aside>

        <main class="content">

            <header>
                <div>
                    <p class="small-title">PRODUCTIVITY</p>
                    <h1>Good afternoon.</h1>
                    <p class="subtitle">Keep your work simple and focused.</p>
                </div>

                <p id="date"></p>
            </header>

            <section class="stats">

                <div class="card">
                    <span>Completed</span>
                    <strong id="completed">0</strong>
                </div>

                <div class="card">
                    <span>Remaining</span>
                    <strong id="remaining">0</strong>
                </div>

                <div class="card">
                    <span>Progress</span>
                    <strong id="progress">0%</strong>
                </div>

            </section>

            <section class="progress-card">
                <div class="progress-top">
                    <div>
                        <p class="small-title">TODAY'S PROGRESS</p>
                        <h3>Keep going</h3>
                    </div>

                    <strong id="progressText">0%</strong>
                </div>

                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>
            </section>

            <section class="tasks">

                <div class="tasks-header">
                    <div>
                        <p class="small-title">TASKS</p>
                        <h2 id="taskHeading">All Tasks</h2>
                    </div>

                    <button id="addBtn">+ Add Task</button>
                </div>

                <div class="filters">
                    <button class="selected" data-priority="all">All</button>
                    <button data-priority="high">High</button>
                    <button data-priority="medium">Medium</button>
                    <button data-priority="low">Low</button>
                </div>

                <div id="taskList"></div>

                <div id="empty" class="empty">
                    <h3>No tasks found</h3>
                    <p>Add a task to get started.</p>
                </div>

            </section>

        </main>

    </div>

    <div id="modal" class="modal-bg">

        <div class="modal">

            <div class="modal-head">
                <h2>Add Task</h2>
                <button id="closeBtn">×</button>
            </div>

            <form id="taskForm">

                <label>Task</label>
                <input id="taskName" type="text" placeholder="Enter task name" required>

                <label>Priority</label>
                <select id="taskPriority">
                    <option value="high">High</option>
                    <option value="medium" selected>Medium</option>
                    <option value="low">Low</option>
                </select>

                <button type="submit">Add Task</button>

            </form>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
